name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Clean stale bundle output
        shell: bash
        run: rm -rf apps/desktop/src-tauri/target/*/release/bundle apps/desktop/src-tauri/target/release/bundle

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: "GitBud ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  notes:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate checksums and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          mkdir -p release-assets
          cd release-assets
          gh release download "$TAG" --repo "$REPO"

          # Generate SHA256SUMS for release binaries and archives
          find . -maxdepth 1 -type f ! -name "SHA256SUMS*" ! -name "latest.json" ! -name "*.sig" ! -name "*.asc" -exec sha256sum {} + | sed 's| \./|  |' | sort -k 2 > ../SHA256SUMS
          cd ..

          upload_files=("SHA256SUMS")

          if [ -n "${GPG_SIGNING_KEY:-}" ]; then
            echo "Importing GPG signing key..."
            mkdir -p ~/.gnupg
            chmod 700 ~/.gnupg
            echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
            gpgconf --reload gpg-agent 2>/dev/null || true

            python3 -c '
import os, sys, base64

key = os.environ.get("GPG_SIGNING_KEY", "").strip()
if not key:
    sys.exit(0)

if "\\n" in key and "\n" not in key:
    key = key.replace("\\r\\n", "\n").replace("\\n", "\n")

if "-----BEGIN" in key and "KEY BLOCK-----" in key:
    sys.stdout.buffer.write(key.encode("utf-8") + b"\n")
else:
    cleaned = "".join(key.split())
    try:
        decoded = base64.b64decode(cleaned)
        try:
            decoded_str = decoded.decode("utf-8")
            if "-----BEGIN" in decoded_str:
                if "\\n" in decoded_str and "\n" not in decoded_str:
                    decoded_str = decoded_str.replace("\\r\\n", "\n").replace("\\n", "\n")
                decoded = decoded_str.encode("utf-8")
        except Exception:
            pass
        sys.stdout.buffer.write(decoded)
    except Exception:
        sys.stdout.buffer.write(key.encode("utf-8") + b"\n")
' | gpg --batch --import

            gpg_opts=(--batch --yes)
            if [ -n "${GPG_PASSPHRASE:-}" ]; then
              gpg_opts+=(--pinentry-mode loopback --passphrase "$GPG_PASSPHRASE")
            fi

            gpg "${gpg_opts[@]}" --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
            upload_files+=("SHA256SUMS.asc")

            for file in release-assets/*.deb release-assets/*.rpm release-assets/*.AppImage; do
              if [ -f "$file" ]; then
                gpg "${gpg_opts[@]}" --armor --detach-sign --output "$file.asc" "$file"
                upload_files+=("$file.asc")
              fi
            done
          else
            echo "GPG_SIGNING_KEY secret is not configured. Skipping GPG detached signature generation."
          fi

          gh release upload "$TAG" "${upload_files[@]}" --repo "$REPO" --clobber

      - name: Build release notes (changelog + download links)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > changelog.md

          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          find_url() {
            pattern="$1"
            name=$(echo "$assets" | grep -Ei "$pattern" | head -n1 || true)
            if [ -n "$name" ]; then
              echo "https://github.com/$REPO/releases/download/$TAG/$name"
            fi
          }

          mac_arm=$(find_url '_aarch64\.dmg$')
          mac_intel=$(find_url '_x(64|86_64)\.dmg$')
          win_msi=$(find_url '\.msi$')
          win_exe=$(find_url '-setup\.exe$')
          deb=$(find_url '\.deb$')
          rpm=$(find_url '\.rpm$')
          appimage=$(find_url '\.AppImage$')
          sha256sums=$(find_url '^SHA256SUMS$')
          sha256sums_asc=$(find_url '^SHA256SUMS\.asc$')

          {
            cat changelog.md
            echo ""
            echo "---"
            echo ""
            echo "See the assets below to download and install for your platform."
            echo ""
            echo "**macOS:**"
            [ -n "$mac_arm" ] && echo "- [Apple Silicon]($mac_arm)"
            [ -n "$mac_intel" ] && echo "- [Intel]($mac_intel)"
            echo ""
            echo "> Not code-signed yet: macOS will say \`\"GitBud.app\" is damaged and can't be opened\`. Fix: \`xattr -cr /Applications/GitBud.app\`"
            echo ""
            echo "**Windows:**"
            [ -n "$win_msi" ] && echo "- [Installer (.msi)]($win_msi)"
            [ -n "$win_exe" ] && echo "- [Installer (.exe)]($win_exe)"
            echo ""
            echo "**Linux:**"
            [ -n "$deb" ] && echo "- [.deb (Debian/Ubuntu)]($deb)"
            [ -n "$rpm" ] && echo "- [.rpm (Fedora/RHEL)]($rpm)"
            [ -n "$appimage" ] && echo "- [AppImage]($appimage)"
            if [ -n "$sha256sums" ]; then
              echo ""
              echo "**Verification:**"
              echo "- [SHA256SUMS]($sha256sums)"
              [ -n "$sha256sums_asc" ] && echo "- [SHA256SUMS.asc (GPG Signature)]($sha256sums_asc)"
            fi
          } > notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
