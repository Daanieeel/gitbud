name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Clean stale bundle output
        shell: bash
        run: rm -rf src-tauri/target/*/release/bundle src-tauri/target/release/bundle

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          includeUpdaterJson: true
          tagName: ${{ github.ref_name }}
          releaseName: "GitBud ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install for your platform."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  notes:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build release notes (changelog + download links)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" --jq .body > changelog.md

          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          find_url() {
            pattern="$1"
            name=$(echo "$assets" | grep -Ei "$pattern" | head -n1 || true)
            if [ -n "$name" ]; then
              echo "https://github.com/$REPO/releases/download/$TAG/$name"
            fi
          }

          mac_arm=$(find_url '_aarch64\.dmg$')
          mac_intel=$(find_url '_x(64|86_64)\.dmg$')
          win_msi=$(find_url '\.msi$')
          win_exe=$(find_url '-setup\.exe$')
          deb=$(find_url '\.deb$')
          rpm=$(find_url '\.rpm$')
          appimage=$(find_url '\.AppImage$')

          {
            cat changelog.md
            echo ""
            echo "---"
            echo ""
            echo "See the assets below to download and install for your platform."
            echo ""
            echo "**macOS:**"
            [ -n "$mac_arm" ] && echo "- [Apple Silicon]($mac_arm)"
            [ -n "$mac_intel" ] && echo "- [Intel]($mac_intel)"
            echo ""
            echo "> Not code-signed yet — macOS will say \`\"GitBud.app\" is damaged and can't be opened\`. Fix: \`xattr -cr /Applications/GitBud.app\`"
            echo ""
            echo "**Windows:**"
            [ -n "$win_msi" ] && echo "- [Installer (.msi)]($win_msi)"
            [ -n "$win_exe" ] && echo "- [Installer (.exe)]($win_exe)"
            echo ""
            echo "**Linux:**"
            [ -n "$deb" ] && echo "- [.deb (Debian/Ubuntu)]($deb)"
            [ -n "$rpm" ] && echo "- [.rpm (Fedora/RHEL)]($rpm)"
            [ -n "$appimage" ] && echo "- [AppImage]($appimage)"
          } > notes.md

          gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
